<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hilltech Media Group</title>
  <link rel="stylesheet" href="styles.css">
  <!-- Firebase & App Script -->
  <script type="module" src="app.js"></script>
</head>
<body>

  <header>
    <!-- Navigation / Header content -->
  </header>

  <main class="booking-section">
    <div class="booking-card">
      <h2>Let's plan your <i>next move.</i></h2>

      <form id="bookingForm" class="booking-grid">
        <div class="form-group">
          <label for="name">Name</label>
          <input type="text" id="name" name="name" placeholder="Your name" required>
        </div>
        
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required>
        </div>
        
        <div class="form-group">
          <label for="phone">Phone</label>
          <input type="tel" id="phone" name="phone" placeholder="07xx xxx xxx" required>
        </div>
        
        <div class="form-group">
          <label for="service">Service</label>
          <select id="service" name="service" required>
            <option value="" disabled selected>Select service</option>
            <option value="Video Production">Video Production</option>
            <option value="Audio Production">Audio Production</option>
            <option value="Event Coverage">Event Coverage</option>
            <option value="Social Content">Social Content</option>
          </select>
        </div>
        
        <div class="form-group">
          <label for="event_date">Event Date</label>
          <input type="date" id="event_date" name="event_date" required>
        </div>
        
        <div class="form-group">
          <label for="event_time">Event Time</label>
          <input type="time" id="event_time" name="event_time" required>
        </div>
        
        <div class="form-group">
          <label for="location">Location</label>
          <input type="text" id="location" name="location" placeholder="Event location" required>
        </div>
        
        <div class="form-group">
          <label for="budget">Budget</label>
          <input type="text" id="budget" name="budget" placeholder="Estimated budget">
        </div>
        
        <div class="form-group" style="grid-column: 1 / -1;">
          <label for="details">Project Details</label>
          <textarea id="details" name="details" placeholder="Tell us more about your project..." rows="4"></textarea>
        </div>

        <!-- Hidden honeypot field -->
        <input type="text" name="website" style="display:none" tabindex="-1" autocomplete="off">

        <!-- Status message container -->
        <div id="bookingStatus" class="status" style="grid-column: 1 / -1; margin-bottom: 10px;"></div>

        <!-- Submit button -->
        <div style="grid-column: 1 / -1;">
          <button type="submit" class="submit-btn" style="width: 100%; padding: 12px; cursor: pointer;">Send Booking Request</button>
        </div>
      </form>
    </div>
  </main>

</body>
</html>
